# Coarse location-prior run 1/5: whole volume downsampled to 64^3, ce loss.
# The trained model predicts where the organs are and can serve as a prior
# for placing boxes in a later fine-grained run.
paths:
  data_path: /scratch-shared/scur0088/data

dataset:
  name: SEGTHOR_aug
  num_classes: 5
  coarse: true
  coarse_size: [64, 64, 64]

model:
  name: UNet3D
  is_3d: true
  kernels: 8
  factor: 2
  dropout: 0.01

training:
  epochs: 100
  batch_size: 8
  batches_per_epoch: 20
  lr: 0.0005
  scheduler: cosine
  mode: full
  loss: ce

runtime:
  num_workers: 8
  amp_dtype: bf16

wandb:
  project: SEGTHOR-UNet3D-coarse
  notes: coarse 64^3, ce

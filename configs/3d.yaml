paths:
  data_path: /scratch-shared/scur0088/tars

dataset:
  name: SEGTHOR_3D_1ch
  num_classes: 5

model:
  name: UNet3D
  is_3d: true
  # 1 for SEGTHOR_3D_1ch, 3 for SEGTHOR_3D_3ch
  in_channels: 1
  # 16 matches the local runs (ResUNet3D ~2.6M params); 32 fits an A100/H100
  kernels: 16
  factor: 2
  # Dropout3d drops whole feature channels: 0.4 removed 40% of every block's
  # channels. Back to the repo default.
  dropout: 0.01

training:
  epochs: 50
  batch_size: 8
  batches_per_epoch: 100
  lr: 0.0005
  scheduler: cosine
  mode: full
  loss: dice_ce
  # IDk what a good weight decay is
  weight_decay: 0.005
  seed: 42

eval:
  enabled: true
  submission: true
  # Largest connected component for heart / trachea / aorta (src/postprocess.py)
  postprocess: [lcc]

augmentation:
  enabled: false

runtime:
  num_workers: 8
  amp_dtype: bf16

wandb:
  project: SEGTHOR-3D
  notes: First run of 3D models on SEGTHOR dataset. Using UNet3D, ResUNet3D, VNet3D, and MedNeXt3D architectures. Training for 50 epochs with batch size of 8 and learning rate of 0.0005. Using cosine scheduler and dice_ce loss function. Weight decay set to 0.005. Evaluation enabled with submission generation.